<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>clusterscope · endpoints</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    padding: 1.25rem 1.5rem 2rem;
    font-size: 0.82rem;
  }
  h2 { font-size: 1rem; font-weight: 700; color: #e2e8f0; letter-spacing: -0.01em; }
  h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #4a5568; font-weight: 600; margin: 1.75rem 0 0.6rem; }
  .muted { color: #64748b; }
  .top { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .top .updated { font-size: 0.72rem; color: #4a5568; margin-left: auto; }

  /* summary */
  .summary { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .stat { background: #141720; border: 1px solid #2d3148; border-radius: 8px; padding: 0.55rem 0.8rem; min-width: 110px; }
  .stat .v { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 0.68rem; color: #64748b; margin-top: 0.1rem; }
  .stat.bad .v { color: #f85149; }
  .stat.warn .v { color: #f0883e; }
  .stat.good .v { color: #3fb950; }

  /* controls */
  .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
  .controls input[type=search], .controls select {
    background: #1a1d27; border: 1px solid #2d3148; border-radius: 6px;
    padding: 0.4rem 0.6rem; font-size: 0.8rem; color: #e2e8f0; outline: none;
  }
  .controls input[type=search] { width: 280px; max-width: 100%; }
  .controls input[type=search]:focus, .controls select:focus { border-color: #58a6ff; }
  .controls label { display: flex; align-items: center; gap: 0.35rem; color: #94a3b8; cursor: pointer; }
  .controls .count { color: #4a5568; font-size: 0.72rem; margin-left: auto; }

  /* notices */
  .notice { background: #141720; border: 1px solid #2d3148; border-left: 3px solid #f0883e; border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.76rem; }
  .notice.bad { border-left-color: #f85149; }

  /* table */
  .table-wrap { overflow-x: auto; border: 1px solid #2d3148; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; font-weight: 600; padding: 0.55rem 0.7rem; background: #141720; border-bottom: 1px solid #2d3148; white-space: nowrap; }
  td { padding: 0.5rem 0.7rem; border-bottom: 1px solid #1e2235; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr.problem td:first-child { box-shadow: inset 3px 0 0 #f85149; }
  tr.stale td { opacity: 0.6; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; }
  .sub { display: block; font-size: 0.7rem; color: #64748b; margin-top: 0.1rem; }
  .pill { display: inline-block; font-size: 0.65rem; padding: 0.08rem 0.45rem; border-radius: 9999px; margin: 0 0.2rem 0.2rem 0; white-space: nowrap; }
  .pill.ok { background: #12301d; color: #3fb950; }
  .pill.bad { background: #3a1618; color: #f85149; }
  .pill.warn { background: #3a2614; color: #f0883e; }
  .pill.unk { background: #1e2235; color: #94a3b8; }
  .pill.cluster { background: #1e2a45; color: #60a5fa; }
  .empty { padding: 2rem; text-align: center; color: #4a5568; }
</style>
</head>
<body>
<div class="top">
  <h2>Endpoints</h2>
  <span class="muted" id="scope"></span>
  <span class="updated" id="updated"></span>
</div>

<div class="summary" id="summary"></div>
<div id="notices"></div>

<div class="controls">
  <input type="search" id="q" placeholder="Filter hostname, route, app, backend…" aria-label="Filter routes">
  <select id="cluster" aria-label="Cluster"><option value="">All clusters</option></select>
  <label><input type="checkbox" id="problems"> Problems only</label>
  <span class="count" id="count"></span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Cluster</th>
        <th>URL / Hostname</th>
        <th>Route</th>
        <th>Gateway</th>
        <th>Status</th>
        <th>Probe</th>
        <th>Backends</th>
        <th>App</th>
      </tr>
    </thead>
    <tbody id="routes"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
  </table>
</div>

<h3>Gateways</h3>
<div class="table-wrap">
  <table>
    <thead>
      <tr><th>Cluster</th><th>Gateway</th><th>Class</th><th>Listeners</th><th>Addresses</th><th>Status</th></tr>
    </thead>
    <tbody id="gateways"></tbody>
  </table>
</div>

<script>
const CERT_WARN_DAYS = 14;
let data = null;

const params = new URLSearchParams(location.search);
const els = {
  q: document.getElementById("q"),
  cluster: document.getElementById("cluster"),
  problems: document.getElementById("problems"),
};
if (params.get("cluster")) els.cluster.dataset.initial = params.get("cluster");
if (params.get("problems") === "1") els.problems.checked = true;
els.q.value = params.get("q") || "";

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function condPill(label, v) {
  const cls = v === "True" ? "ok" : v === "False" ? "bad" : "unk";
  return `<span class="pill ${cls}" title="${esc(label)}: ${esc(v)}">${esc(label)}</span>`;
}

function certDays(p) {
  if (!p.certExpiry) return null;
  return Math.floor((new Date(p.certExpiry) - Date.now()) / 86400000);
}

function probePill(p) {
  if (!p.ok) {
    return `<span class="pill bad" title="${esc(p.error)}">${esc(p.stage || "fail")}${p.statusCode ? " " + p.statusCode : ""}</span>`;
  }
  let out = `<span class="pill ok" title="${esc(p.url)}">${p.statusCode} · ${p.latencyMs}ms</span>`;
  const d = certDays(p);
  if (d !== null) {
    out += `<span class="pill ${d < CERT_WARN_DAYS ? "warn" : "unk"}" title="certificate expires ${esc(p.certExpiry)}">cert ${d}d</span>`;
  }
  return out;
}

function routeProblems(r) {
  const probs = [];
  if (r.accepted !== "True") probs.push("not accepted");
  if (r.resolvedRefs !== "True") probs.push("refs unresolved");
  for (const p of r.probes || []) {
    if (!p.ok) probs.push("probe failed");
    const d = certDays(p);
    if (d !== null && d < CERT_WARN_DAYS) probs.push("cert expiring");
  }
  if (r.stale) probs.push("stale");
  return probs;
}

function render() {
  if (!data) return;
  const q = els.q.value.trim().toLowerCase();
  const cl = els.cluster.value;
  const onlyProblems = els.problems.checked;

  const rows = data.routes.filter(r => {
    if (cl && r.cluster !== cl) return false;
    if (onlyProblems && routeProblems(r).length === 0) return false;
    if (!q) return true;
    const hay = [r.cluster, r.namespace, r.name, r.app, ...(r.hostnames || []), ...(r.backends || []), ...(r.parents || []).map(p => p.gateway)].join(" ").toLowerCase();
    return hay.includes(q);
  });

  document.getElementById("count").textContent = `${rows.length} of ${data.routes.length} routes`;

  const tbody = document.getElementById("routes");
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">${data.routes.length ? "No routes match the filter." : "No HTTPRoutes found."}</td></tr>`;
  } else {
    tbody.innerHTML = rows.map(r => {
      const probs = routeProblems(r);
      const hosts = (r.urls && r.urls.length)
        ? r.urls.map(u => `<a class="mono" href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("<br>")
        : (r.hostnames || []).map(h => `<span class="mono">${esc(h)}</span>`).join("<br>") || '<span class="muted">—</span>';
      const wild = (r.hostnames || []).filter(h => h.includes("*"));
      const gws = (r.parents || []).map(p => `<span class="mono">${esc(p.gateway)}</span>${p.message ? `<span class="sub">${esc(p.message)}</span>` : ""}`).join("<br>");
      const probes = !data.probing
        ? '<span class="muted" title="start with -probe to enable">off</span>'
        : r.noProbe
        ? '<span class="pill unk" title="excluded by annotation clusterscope.stuttgart-things.com/probe: &quot;false&quot;">not probed</span>'
        : ((r.probes || []).map(probePill).join("") || '<span class="muted">—</span>');
      return `<tr class="${probs.length ? "problem" : ""} ${r.stale ? "stale" : ""}" title="${esc(probs.join(", "))}">
        <td><span class="pill cluster">${esc(r.cluster)}</span>${r.stale ? '<span class="sub">stale</span>' : ""}</td>
        <td>${hosts}${wild.length && r.urls && r.urls.length ? `<span class="sub">${wild.map(esc).join(", ")}</span>` : ""}${r.paths && r.paths.length > 1 ? `<span class="sub">paths: ${r.paths.map(esc).join(", ")}</span>` : ""}</td>
        <td><span class="mono">${esc(r.namespace)}/${esc(r.name)}</span></td>
        <td>${gws || '<span class="muted">—</span>'}</td>
        <td>${condPill("Accepted", r.accepted)}${condPill("ResolvedRefs", r.resolvedRefs)}</td>
        <td>${probes}</td>
        <td>${(r.backends || []).map(b => `<span class="mono">${esc(b)}</span>`).join("<br>") || '<span class="muted">—</span>'}</td>
        <td>${r.app ? esc(r.app) : '<span class="muted">—</span>'}</td>
      </tr>`;
    }).join("");
  }

  const gwRows = data.gateways.filter(g => !cl || g.cluster === cl);
  document.getElementById("gateways").innerHTML = gwRows.length
    ? gwRows.map(g => `<tr>
        <td><span class="pill cluster">${esc(g.cluster)}</span></td>
        <td><span class="mono">${esc(g.namespace)}/${esc(g.name)}</span></td>
        <td>${esc(g.class)}</td>
        <td>${(g.listeners || []).map(l => `<span class="mono">${esc(l.name)}</span> <span class="muted">${esc(l.protocol)}:${l.port}${l.hostname ? " " + esc(l.hostname) : ""}</span>`).join("<br>")}</td>
        <td class="mono">${(g.addresses || []).map(esc).join("<br>") || '<span class="muted">—</span>'}</td>
        <td>${condPill("Accepted", g.accepted)}${condPill("Programmed", g.programmed)}${g.message && g.programmed !== "True" ? `<span class="sub">${esc(g.message)}</span>` : ""}</td>
      </tr>`).join("")
    : `<tr><td colspan="6" class="empty">No Gateways found.</td></tr>`;

  // keep filters in the URL so a view can be shared
  const p = new URLSearchParams();
  if (cl) p.set("cluster", cl);
  if (q) p.set("q", els.q.value.trim());
  if (onlyProblems) p.set("problems", "1");
  history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
}

function renderSummary() {
  const routes = data.routes;
  const notAccepted = routes.filter(r => r.accepted !== "True" || r.resolvedRefs !== "True").length;
  const probes = routes.flatMap(r => r.probes || []);
  const probeFail = probes.filter(p => !p.ok).length;
  const certWarn = probes.filter(p => { const d = certDays(p); return d !== null && d < CERT_WARN_DAYS; }).length;
  const stats = [
    { v: data.clusters.length, l: "clusters" },
    { v: routes.length, l: "routes" },
    { v: data.gateways.length, l: "gateways" },
    { v: notAccepted, l: "not accepted / unresolved", cls: notAccepted ? "bad" : "good" },
  ];
  if (data.probing) {
    stats.push({ v: probes.length - probeFail, l: "probes OK", cls: "good" });
    stats.push({ v: probeFail, l: "probes failed", cls: probeFail ? "bad" : "good" });
    stats.push({ v: certWarn, l: `certs < ${CERT_WARN_DAYS}d`, cls: certWarn ? "warn" : "good" });
  }
  document.getElementById("summary").innerHTML = stats.map(s =>
    `<div class="stat ${s.cls || ""}"><div class="v">${s.v}</div><div class="l">${esc(s.l)}</div></div>`).join("");

  const notices = [];
  for (const c of data.clusters) {
    if (c.reachability === "unreachable") notices.push(`<div class="notice bad"><b>${esc(c.name)}</b>: API server unreachable${c.stale ? " — showing last known routes" : ""}.</div>`);
    else if (c.reachability === "unconfigured") notices.push(`<div class="notice"><b>${esc(c.name)}</b>: no kubeconfig — routes unknown.</div>`);
    else if (c.error) notices.push(`<div class="notice bad"><b>${esc(c.name)}</b>: ${esc(c.error)}</div>`);
    else if (c.collectedAt && !c.gatewayAPI) notices.push(`<div class="notice"><b>${esc(c.name)}</b>: Gateway API CRDs not installed.</div>`);
  }
  document.getElementById("notices").innerHTML = notices.join("");
}

function load() {
  fetch("/api/endpoints")
    .then(r => r.json())
    .then(d => {
      data = d;
      const sel = els.cluster;
      const want = sel.value || sel.dataset.initial || "";
      delete sel.dataset.initial;
      sel.innerHTML = '<option value="">All clusters</option>' +
        d.clusters.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("");
      sel.value = d.clusters.some(c => c.name === want) ? want : "";
      document.getElementById("scope").textContent = d.clusters.length ? "" : "live mode is off — start with -live";
      document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
      renderSummary();
      render();
    })
    .catch(() => {
      document.getElementById("routes").innerHTML = '<tr><td colspan="8" class="empty">Failed to load /api/endpoints.</td></tr>';
    });
}

els.q.addEventListener("input", render);
els.cluster.addEventListener("change", render);
els.problems.addEventListener("change", render);
load();
setInterval(load, 30000);
</script>
</body>
</html>
