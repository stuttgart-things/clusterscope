---
# Deploys the docs. Dispatched by release-please.yaml on every release (a
# workflow_run trigger does not fire for runs started with the GITHUB_TOKEN),
# or by hand.
name: Deploy Pages
on:
  workflow_dispatch:

jobs:
  pages:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-deploy-pages.yaml@15bb803fd72658fda50120f8a566d5594061e6ee # v1.2.0
    with:
      runs-on: ubuntu-latest
    secrets: inherit # pragma: allowlist secret
